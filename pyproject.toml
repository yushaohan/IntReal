[project]
name = "intreal"
version = "0.1.0"
description = "Evaluation for multimodal interleaved generation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.8.0",
    "torchvision==0.23.0",
    "transformers==5.5.4",
    "huggingface-hub==1.33.0",
    "pillow==12.2.0",
    "numpy==2.4.4",
    "joblib==1.5.3",
    "scikit-learn==1.7.2",
    "openai==2.31.0",
    "pyyaml==6.0.3",
    "tqdm==4.67.3",
]

[tool.uv]
package = false
# Initial supported environment: Linux x86_64 with CUDA 12.8 PyTorch wheels.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
