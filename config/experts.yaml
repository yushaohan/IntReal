# Export these variables before running API-based metrics.
api:
  model_env: INTREAL_API_MODEL
  api_base_env: INTREAL_API_BASE_URL
  api_key_env: INTREAL_API_KEY

# Model files are supplied separately. Paths are relative to the working directory.
# Set cuda to cuda:0 (or another device) to use a GPU.
local:
  aesthetic-predictor:
    path: "${INTREAL_RALI_PATH:-experts/RALI/}"
    cuda: "${INTREAL_RALI_DEVICE:-cpu}"
  dino:
    path: "${INTREAL_DINO_PATH:-experts/DINOv3/}"
    cuda: "${INTREAL_DINO_DEVICE:-cpu}"
