# Export these variables before running API-based metrics.
api:
  llm-api:
    model_env: INTREAL_LLM_MODEL
    api_base_env: INTREAL_LLM_BASE_URL
    api_key_env: INTREAL_LLM_API_KEY
  vlm-api:
    model_env: INTREAL_VLM_MODEL
    api_base_env: INTREAL_VLM_BASE_URL
    api_key_env: INTREAL_VLM_API_KEY

# Model files are supplied separately. Paths are relative to the working directory.
# Set cuda to cuda:0 (or another device) to use a GPU.
local:
  aesthetic-predictor:
    path: experts/RALI/
    cuda: cpu
  dino:
    path: experts/DINOv3/
    cuda: cpu
